{% extends 'myadmin/index.html' %}
{% block content %}
<div class="page-content fade-in-up">
    <div class="row">
        <div class="col-md-12">
            <div class="ibox">
                <div class="ibox-head">
                    <div class="ibox-title">All Subcategories</div>
                    <a href="{% url 'add_subcategory' %}" class="btn btn-primary btn-sm">+ Add New</a>
                </div>
                <div class="ibox-body">
                    <table class="table table-striped table-bordered">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Subcategory Name</th>
                                <th>Category</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for sub in subcategories %}
                            <tr>
                                <td>{{ forloop.counter }}</td>
                                <td>{{ sub.sub_name }}</td>
                                <td>{{ sub.cat.cat_name }}</td>
                                <td>
                                    <a href="{% url 'edit_subcategory' sub.sub_id %}" class="btn btn-warning btn-sm">Edit</a>
                                    <a href="{% url 'delete_subcategory' sub.sub_id %}" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure?')">Delete</a>
                                </td>
                            </tr>
                            {% empty %}
                            <tr>
                                <td colspan="4" class="text-center">No subcategories found</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
