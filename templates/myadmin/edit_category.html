{% extends 'myadmin/index.html' %}
{% block content %}
<div class="page-content fade-in-up">
    <div class="row">
        <div class="col-md-6">
            <div class="ibox">
                <div class="ibox-head">
                    <div class="ibox-title">Edit Category</div>
                </div>
                <div class="ibox-body">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="form-group">
                            <label>Category Name</label>
                            <input type="text" name="cat_name" class="form-control" value="{{ cat.cat_name }}" required>
                        </div>
                        <button type="submit" class="btn btn-success">Update</button>
                        <a href="{% url 'all_category' %}" class="btn btn-secondary">Back</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
