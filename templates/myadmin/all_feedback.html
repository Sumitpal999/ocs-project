{% extends 'myadmin/index.html' %}
{% block content %}
<div class="page-content fade-in-up">
    <div class="row">
        <div class="col-md-12">
            <div class="ibox">
                <div class="ibox-head">
                    <div class="ibox-title">All Feedback</div>
                </div>
                <div class="ibox-body">
                    <table class="table table-striped table-bordered">
                        <thead>
                            <tr>
                                <th>id</th>
                                <th>User</th>
                                <th>Comment</th>
                                <th>Rating</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for fb in feedbacks %}
                            <tr>
                                <td>{{ forloop.counter }}</td>
                                <td>{{ fb.user.name }}</td>
                                <td>{{ fb.comment }}</td>
                                <td>{{ fb.rating }}/5</td>
                                <td>{{ fb.f_date }}</td>
                            </tr>
                            {% empty %}
                            <tr>
                                <td colspan="5" class="text-center">No feedback found</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
