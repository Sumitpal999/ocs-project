{% extends 'myadmin/index.html' %}
{% load static %}
{% block content %}
<div class="page-content fade-in-up">
    <div class="row">

        <!-- Total Products -->
        <div class="col-lg-3 col-md-6">
            <div class="ibox bg-success color-white widget-stat">
                <div class="ibox-body">
                    <h2 class="m-b-5 font-strong">{{ total_products }}</h2>
                    <div class="m-b-5">TOTAL PRODUCTS</div>
                    <i class="ti-shopping-cart widget-stat-icon"></i>
                </div>
            </div>
        </div>

        <!-- Total Orders -->
        <div class="col-lg-3 col-md-6">
            <div class="ibox bg-info color-white widget-stat">
                <div class="ibox-body">
                    <h2 class="m-b-5 font-strong">{{ total_orders }}</h2>
                    <div class="m-b-5">TOTAL ORDERS</div>
                    <i class="ti-bar-chart widget-stat-icon"></i>
                </div>
            </div>
        </div>

        <!-- Total Inquiry -->
        <div class="col-lg-3 col-md-6">
            <div class="ibox bg-warning color-white widget-stat">
                <div class="ibox-body">
                    <h2 class="m-b-5 font-strong">{{ total_inquiry }}</h2>
                    <div class="m-b-5">TOTAL INQUIRY</div>
                    <i class="fa fa-envelope widget-stat-icon"></i>
                </div>
            </div>
        </div>

        <!-- Total Users -->
        <div class="col-lg-3 col-md-6">
            <div class="ibox bg-danger color-white widget-stat">
                <div class="ibox-body">
                    <h2 class="m-b-5 font-strong">{{ total_users }}</h2>
                    <div class="m-b-5">TOTAL USERS</div>
                    <i class="ti-user widget-stat-icon"></i>
                </div>
            </div>
        </div>

    </div>
</div>
{% endblock %}
