{% extends 'myadmin/index.html' %}

{% block content %}
<div class="page-content fade-in-up">
    <div class="row">
        <div class="col-md-12">
            <div class="ibox">
                <div class="ibox-head">
                    <div class="ibox-title">All Orders</div>
                </div>

                <div class="ibox-body">
                    <table class="table table-striped table-bordered">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Customer</th>
                                <th>Amount</th>
                                <th>Method</th>
                                <th>Status</th> 
                                <th>Delete</th>
                            </tr>
                        </thead>

                        <tbody>
                            {% for order in orders %}
                            <tr>
                                <td>{{ forloop.counter }}</td>
                                <td>{{ order.user.name }}</td>
                                <td>₹{{ order.amount }}</td>
                                <td>{{ order.method }}</td>

                                <td>
                                    <form action="{% url 'update_order_status' order.o_id %}" method="POST" style="display:flex; gap:5px;">
                                        {% csrf_token %}

                                        <select name="status" class="form-control form-control-sm" style="width:auto;">

                                            <option value="pending" {% if order.status == 'pending' %}selected{% endif %}>
                                                Pending
                                            </option>

                                            <option value="processing" {% if order.status == 'processing' %}selected{% endif %}>
                                                Processing
                                            </option>

                                            <option value="shipped" {% if order.status == 'shipped' %}selected{% endif %}>
                                                Shipped
                                            </option>

                                            <option value="delivered" {% if order.status == 'delivered' %}selected{% endif %}>
                                                Delivered
                                            </option>

                                            <option value="cancelled" {% if order.status == 'cancelled' %}selected{% endif %}>
                                                Cancelled
                                            </option>

                                        </select>

                                        <button type="submit" class="btn btn-primary btn-sm">
                                            Update
                                        </button>
                                    </form>
                                </td>

                                <td>
                                    <a href="{% url 'delete_order' order.o_id %}"
                                       class="btn btn-danger btn-sm"
                                       onclick="return confirm('Order delete karna hai?')">
                                        Delete
                                    </a>
                                </td>

                            </tr>

                            {% empty %}
                            <tr>
                                <td colspan="6" class="text-center">
                                    No orders found
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>

                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
