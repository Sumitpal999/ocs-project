{% extends 'myadmin/index.html' %}
{% block content %}
<div class="page-content fade-in-up">
    <div class="row">
        <div class="col-md-6">
            <div class="ibox">
                <div class="ibox-head">
                    <div class="ibox-title">Add Subcategory</div>
                </div>
                <div class="ibox-body">
                    <form method="POST" action="{% url 'store_subcategory' %}">
                        {% csrf_token %}
                        <div class="form-group">
                            <label>Category</label>
                            <select name="cat_id" class="form-control" required>
                                <option value="">-- Select Category --</option>
                                {% for cat in categories %}
                                <option value="{{ cat.cat_id }}">{{ cat.cat_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Subcategory Name</label>
                            <input type="text" name="sub_name" class="form-control" placeholder="Enter subcategory name" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Add Subcategory</button>
                        <a href="{% url 'all_subcategory' %}" class="btn btn-secondary">Back</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
