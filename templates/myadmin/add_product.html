{% extends 'myadmin/index.html' %}
{% block content %}
<div class="page-content fade-in-up">
    <div class="row">
        <div class="col-md-12">
            <div class="ibox">
                <div class="ibox-head">
                    <div class="ibox-title">Add Product</div>
                </div>
                <div class="ibox-body">
                    <form method="POST" action="{% url 'store_product' %}" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="form-group">
                            <label>Product Name</label>
                            <input type="text" name="pname" class="form-control" placeholder="Enter product name"
                                required>
                        </div>
                        <div class="form-group">
                            <label>Price</label>
                            <input type="number" name="price" class="form-control" placeholder="Enter price" required>
                        </div>
                        <div class="form-group">
                            <label>Category</label>
                            <select name="cat_id" class="form-control" required>
                                <option value="">-- Select Category --</option>
                                {% for cat in categories %}
                                <option value="{{ cat.cat_id }}">{{ cat.cat_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Subcategory</label>
                            <select name="sub_id" class="form-control" required>
                                <option value="">-- Select Subcategory --</option>
                                {% for sub in subcategories %}
                                <option value="{{ sub.sub_id }}">{{ sub.sub_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Small Description</label>
                            <textarea name="small_description" class="form-control" rows="2"
                                placeholder="Short description" required></textarea>
                        </div>
                        <div class="form-group">
                            <label>Large Description</label>
                            <textarea name="large_description" class="form-control" rows="4"
                                placeholder="Full description" required></textarea>
                        </div>
                        <div class="form-group">
                            <label>Quantity</label>
                            <input type="number" name="quantity" class="form-control" placeholder="Enter quantity"
                                required>
                        </div>
                        <div class="form-group">
                            <label>Tag</label>
                            <select name="tag" class="form-control">
                                <option value="best">Best Seller</option>
                                <option value="new">New Arrival</option>
                                <option value="hot">Hot Sale</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label>Size</label><br>
                            <label class="me-3"><input type="checkbox" name="size" value="S"> S</label>
                            <label class="me-3"><input type="checkbox" name="size" value="M"> M</label>
                            <label class="me-3"><input type="checkbox" name="size" value="L"> L</label>
                            <label class="me-3"><input type="checkbox" name="size" value="XL"> XL</label>
                            <label class="me-3"><input type="checkbox" name="size" value="XXL"> XXL</label>
                        </div>

                        <div class="mb-3">
                            <label>Color</label><br>
                            <label class="me-3"><input type="checkbox" name="color" value="Red"> Red</label>
                            <label class="me-3"><input type="checkbox" name="color" value="Blue"> Blue</label>
                            <label class="me-3"><input type="checkbox" name="color" value="Black"> Black</label>
                            <label class="me-3"><input type="checkbox" name="color" value="White"> White</label>
                            <label class="me-3"><input type="checkbox" name="color" value="Green"> Green</label>
                        </div>
                        <div class="form-group">
                            <label>Product Image</label>
                            <input type="file" name="image" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Add Product</button>
                        <a href="{% url 'all_product' %}" class="btn btn-secondary">Back</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
