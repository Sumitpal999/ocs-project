{% extends 'myadmin/index.html' %}
{% block content %}
<div class="page-content fade-in-up">
    <div class="row">
        <div class="col-md-12">
            <div class="ibox">
                <div class="ibox-head">
                    <div class="ibox-title">All Categories</div>
                    <a href="{% url 'add_category' %}" class="btn btn-primary btn-sm">+ Add New</a>
                </div>
                <div class="ibox-body">
                    <table class="table table-striped table-bordered">
                        <thead>
                            <tr>
                                <th>id</th>
                                <th>Category Name</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for cat in categories %}
                            <tr>
                                <td>{{ forloop.counter }}</td>
                                <td>{{ cat.cat_name }}</td>
                                <td>
                                    <a href="{% url 'edit_category' cat.cat_id %}" class="btn btn-warning btn-sm">Edit</a>
                                    <a href="{% url 'delete_category' cat.cat_id %}" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure?')">Delete</a>
                                </td>
                            </tr>
                            {% empty %}
                            <tr>
                                <td colspan="3" class="text-center">No categories found</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
