<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 0;
        }

        .register-box {
            background: white;
            border-radius: 20px;
            padding: 40px 50px;
            width: 500px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .register-box h2 {
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 25px;
            color: #333;
        }

        .form-control {
            border-radius: 10px;
            border: 1.5px solid #ddd;
            padding: 12px 15px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .form-control:focus {
            border-color: #4e73df;
            box-shadow: none;
        }

        .gender-row {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 15px;
        }

        .btn-register {
            width: 100%;
            padding: 13px;
            background: #4e73df;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            margin-top: 5px;
            cursor: pointer;
        }

        .btn-register:hover {
            background: #3a5bbf;
        }

        .login-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #666;
        }

        .login-link a {
            color: #4e73df;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="register-box">
        <h2>Register</h2>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{% url 'store_register' %}" enctype="multipart/form-data">
            {% csrf_token %}

            <input type="text" name="name" class="form-control" placeholder="Full Name" required>
            <input type="email" name="email" class="form-control" placeholder="Email Address" required>
            <input type="text" name="contact" class="form-control" placeholder="Mobile Number" required>
            <input type="text" name="address" class="form-control" placeholder="Address" required>

            <div class="gender-row">
                <span>Gender :</span>
                <label><input type="radio" name="gender" value="Male" required> Male</label>
                <label><input type="radio" name="gender" value="Female"> Female</label>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>

            <select name="area_id" class="form-control">
                <option value="">----Select a Area-----</option>
                {% for area in areas %}
                <option value="{{ area.area_id }}">{{ area.area_name }}</option>
                {% endfor %}
            </select>

            <select name="city_id" class="form-control">
                <option value="">----Select a City-----</option>
                {% for city in cities %}
                <option value="{{ city.city_id }}">{{ city.city_name }}</option>
                {% endfor %}
            </select>

            <select name="state_id" class="form-control">
                <option value="">----Select a State-----</option>
                {% for state in states %}
                <option value="{{ state.sid }}">{{ state.sname }}</option>
                {% endfor %}
            </select>

            <input type="file" name="image" class="form-control">

            <button type="submit" class="btn-register">Register Now</button>
        </form>

        <div class="login-link">
            Already have an account? <a href="{% url 'home' %}">Back to Home</a>
        </div>
    </div>
</body>

</html>
