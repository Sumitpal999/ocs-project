{% extends 'customer/home.html' %}
{% load static %}
{% block content %}

<style>
    .remove-btn {
        position: static !important;
        top: auto !important;
        left: auto !important;
        display: inline-block !important;
        color: #e74c3c;
        font-size: 14px;
        font-weight: 500;
        margin-top: 8px;
    }

    .remove-btn:hover {
        color: #c0392b;
    }
</style>

<section class="shop spad">
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <h4 class="mb-4">My Wishlist</h4>
            </div>
        </div>
        <div class="row">
            {% for item in items %}
            <div class="col-lg-4 col-md-6 col-sm-6">
                <div class="product__item">
                    <a href="{% url 'shop_details' item.product.p_id %}">
                        <div class="product__item__pic set-bg" data-setbg="{{ item.product.image.url }}"></div>
                    </a>
                    <div class="product__item__text">
                        <h6><a href="{% url 'shop_details' item.product.p_id %}">{{ item.product.pname }}</a></h6>
                        <h5>₹{{ item.product.price }}</h5>
                        <a href="{% url 'remove_from_wishlist' item.product.p_id %}" class="remove-btn">Remove</a>
                    </div>
                </div>
            </div>
            {% empty %}
            <div class="col-lg-12">
                <p>Aapki wishlist khali hai.</p>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
